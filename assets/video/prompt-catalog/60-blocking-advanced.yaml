schema_version: "1.0"
mode: merge
namespaces:
  - key: blocking
    label: Character Blocking
    description: Camera-independent two-person positions, orientation, distance, alignment, gaze, and contact.
    choices:
      - key: straddle_hips_lying_facing
        aliases: [astride-hips-facing, lying-straddle-facing]
        label: Straddle hips while facing a lying person
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Lying person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " lies flat on their back. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels astride the lying person's hips with one knee on each side of their body, centered over their pelvis and directly facing them. The straddling person's torso remains upright, and their hips and shoulders are aligned with the lying person's centerline."

      - key: straddle_lap_seated_facing
        aliases: [seated-straddle-facing, astride-lap-facing]
        label: Straddle a seated person's lap while facing them
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits astride the seated person's lap and hips with one leg on each side, directly facing them. Their torsos face each other, and their bodies remain centered on the same axis."

      - key: straddle_facing_side_profile
        aliases: [straddle-profile, astride-profile]
        label: Side-profile view of a facing straddle
        append: none
        segments:
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " straddles "
          - placeholder:
              id: base_person
              label: Base person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: "'s hips while directly facing them. The camera holds a full-body side-profile two-shot that clearly shows one knee on each side of the base person and both torsos facing each other."

      - key: straddle_hips_lying_facing_away
        aliases: [astride-hips-away, lying-straddle-away]
        label: Straddle hips facing away from a lying person
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Lying person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " lies flat on their back. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels astride the lying person's hips with one knee on each side of their body, facing toward their feet and directly away from their face. The straddling person's back faces the lying person while both bodies remain centered on the same axis."

      - key: straddle_lap_seated_facing_away
        aliases: [seated-straddle-away, astride-lap-away]
        label: Straddle a seated person's lap facing away
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits astride the seated person's lap and hips while facing away, with their back toward the seated person's chest and one leg on each side. Both bodies face the same direction."

      - key: straddle_away_rear_three_quarter
        aliases: [rear-straddle-view, astride-away-camera]
        label: Rear three-quarter view of facing-away straddle
        append: none
        segments:
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " straddles "
          - placeholder:
              id: base_person
              label: Base person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: "'s hips while facing directly away. The camera uses a rear three-quarter full-body view that clearly shows their shared centerline, the straddling person's back toward the base person, and one knee on each side."

      - key: straddle_waist_lying
        aliases: [astride-waist, waist-straddle]
        label: Straddle the waist of a lying person
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Lying person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " lies flat on their back. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels astride the lying person's waist with one knee on each side, torso upright and directly facing them."

      - key: straddle_upper_thighs_seated
        aliases: [astride-upper-thighs, chair-straddle]
        label: Straddle the upper thighs of a seated person
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright on the edge of a chair. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits astride the seated person's upper thighs with one leg on each side, directly facing them and remaining centered between their knees."

      - key: straddle_one_thigh
        aliases: [astride-thigh, single-thigh-straddle]
        label: Straddle one thigh
        append: none
        segments:
          - placeholder:
              id: base_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright with both feet on the floor. "
          - placeholder:
              id: straddling_person
              label: Straddling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits astride the seated person's "
          - placeholder:
              id: thigh
              label: Thigh
              initial_text: "right thigh"
              hint: "Specify left or right thigh"
          - text: " with one knee on each side of that thigh, torso turned toward them."

      - key: upright_supported_straddle
        aliases: [standing-supported, lifted-straddle]
        label: Upright supported straddle
        append: none
        segments:
          - placeholder:
              id: supporting_person
              label: Supporting person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stands upright and supports "
          - placeholder:
              id: supported_person
              label: Supported person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " at hip height. The supported person faces them with one leg on each side of their hips, while both torsos remain upright and aligned."

      - key: sideways_across_lap
        aliases: [side-saddle, lap-sideways]
        label: Sit sideways across a lap
        append: none
        segments:
          - placeholder:
              id: seated_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright. "
          - placeholder:
              id: lap_person
              label: Person across lap
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits sideways across the seated person's lap with both legs on the same side, torso turned toward them."

      - key: all_fours_person_kneeling_behind
        aliases: [hands-knees-kneeling-behind, aligned-behind]
        label: On all fours with another person kneeling behind
        append: none
        segments:
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " is on hands and knees, facing away from "
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " with their back level and knees directly below their hips. The rear person kneels upright directly behind them, centered and aligned with their hips. Both bodies face the same direction and hold the position without further movement."

      - key: all_fours_side_profile
        aliases: [hands-knees-profile, side-profile-alignment]
        label: Side-profile view of all-fours alignment
        append: none
        segments:
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " is on hands and knees while "
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " kneels upright directly behind them, aligned with their hips. The camera holds a full-body side-profile shot that clearly shows both complete poses and the distance between them."

      - key: all_fours_rear_three_quarter
        aliases: [hands-knees-rear-view, wide-rear-alignment]
        label: Rear three-quarter view of all-fours alignment
        append: none
        segments:
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " is on hands and knees facing away from "
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ". The rear person kneels directly behind them on the same centerline. The camera uses a wide rear three-quarter view, keeping both full bodies visible and their alignment unambiguous."

      - key: remain_arm_length_behind
        aliases: [distance-behind, no-contact-behind]
        label: Remain one arm's length behind without contact
        append: none
        segments:
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " remains one arm's length behind "
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " without touching."

      - key: hands_on_hips_hold_pose
        aliases: [gentle-hip-contact, hold-with-contact]
        label: Place both hands gently on hips
        append: none
        segments:
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " places both hands gently on "
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: "'s hips while both hold the pose."

      - key: kneeling_in_front_of_standing
        aliases: [kneel-before-standing, height-alignment]
        label: Kneeling directly in front of a standing person
        append: none
        segments:
          - placeholder:
              id: kneeling_person
              label: Kneeling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels upright directly in front of "
          - placeholder:
              id: standing_person
              label: Standing person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", who stands facing them. The kneeling person's knees are close to the standing person's feet, both bodies share the same centerline, and they look toward each other."

      - key: kneeling_standing_side_profile
        aliases: [kneeling-profile, different-heights-profile]
        label: Side-profile of kneeling and standing people
        append: none
        segments:
          - placeholder:
              id: kneeling_person
              label: Kneeling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels upright directly in front of the standing "
          - placeholder:
              id: standing_person
              label: Standing person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ". The camera frames both people in a full-body side-profile shot, clearly showing their shared centerline, different heights, and face-to-face orientation."

      - key: kneeling_foreground_standing_background
        aliases: [kneeling-front-view, both-face-camera]
        label: Kneeling foreground and standing background
        append: none
        segments:
          - placeholder:
              id: kneeling_person
              label: Kneeling person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " kneels upright in the lower foreground while "
          - placeholder:
              id: standing_person
              label: Standing person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stands centered directly behind in the upper background. Both face the camera rather than each other."
