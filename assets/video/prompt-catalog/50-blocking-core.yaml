schema_version: "1.0"
mode: merge
namespaces:
  - key: blocking
    label: Character Blocking
    description: Camera-independent two-person positions, orientation, distance, alignment, gaze, and contact.
    choices:
      - key: relationship_builder
        aliases: [blocking-builder, spatial-builder]
        label: Build an explicit body relationship
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " "
          - placeholder:
              id: pose_a
              label: First pose
              initial_text: "stands"
              hint: "Describe the first person's vertical pose"
          - text: " "
          - placeholder:
              id: position
              label: Relative position
              initial_text: "directly in front of"
              hint: "Describe position relative to the second person"
          - text: " "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", with "
          - placeholder:
              id: orientation
              label: Body orientation
              initial_text: "both bodies facing each other"
              hint: "Describe orientation independently of the camera"
          - text: ", at "
          - placeholder:
              id: distance
              label: Distance
              initial_text: "close conversational distance"
              hint: "Describe physical distance"
          - text: ", and "
          - placeholder:
              id: contact
              label: Contact
              initial_text: "without touching"
              hint: "Describe contact or explicitly state no contact"
          - text: "."

      - key: face_to_face_centered
        aliases: [face-to-face, directly-facing]
        label: Face-to-face on the same axis
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly in front of "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", facing them. They are centered on the same axis and look directly at each other."

      - key: face_to_face_very_close
        aliases: [close-face-to-face, intimate-distance]
        label: Face-to-face at very close distance
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stand face-to-face at very close distance, with their torsos parallel and their feet aligned."

      - key: face_to_face_arm_length
        aliases: [across-arm-length, face-to-face-distant]
        label: Face-to-face at arm's length
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands across from "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " at arm's length, facing them directly."

      - key: beside_same_direction
        aliases: [side-by-side-forward, aligned-shoulders]
        label: Beside each other facing the same direction
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly beside "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ". Their shoulders are aligned and both face the same direction."

      - key: front_same_direction
        aliases: [one-in-front, aligned-front-back]
        label: One directly in front, both same direction
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly in front of "
          - placeholder:
              id: person_b
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", and both face the same direction. The first person's back is toward the second person."

      - key: behind_same_direction
        aliases: [one-behind, centered-behind]
        label: One directly behind, both same direction
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Rear person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly behind "
          - placeholder:
              id: person_b
              label: Front person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", centered with the front person's back, and both face the same direction."

      - key: behind_facing_back
        aliases: [behind-facing, rear-face-back]
        label: Behind and facing the other person's back
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Rear person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly behind "
          - placeholder:
              id: person_b
              label: Front person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", facing their back, while the front person faces away."

      - key: back_to_back
        aliases: [opposite-directions, backs-touching]
        label: Back-to-back
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stand back-to-back with their shoulders and hips aligned, facing opposite directions."

      - key: right_side_shoulder_to_shoulder
        aliases: [right-side, shoulder-to-shoulder]
        label: On the other person's right side
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Positioned person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands on "
          - placeholder:
              id: person_b
              label: Reference person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: "'s right side, shoulder-to-shoulder with them."

      - key: perpendicular_beside
        aliases: [right-angle, perpendicular-bodies]
        label: Beside with perpendicular bodies
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Turned person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands close beside "
          - placeholder:
              id: person_b
              label: Reference person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " with the first person's body turned perpendicular to the second person's body."

      - key: diagonal_offset
        aliases: [one-step-diagonal, forward-left]
        label: One step forward and diagonally offset
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Offset person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands one step forward and to "
          - placeholder:
              id: person_b
              label: Reference person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: "'s left, turned diagonally toward them."

      - key: between_person_and_object
        aliases: [between-object, blocking-path]
        label: Between a person and an object
        append: none
        segments:
          - placeholder:
              id: person_a
              label: Positioned person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands between "
          - placeholder:
              id: person_b
              label: Other person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: object
              label: Object or landmark
              initial_text: "the doorway"
              hint: "Name the object or spatial landmark"
          - text: ", facing the other person."

      - key: seated_across
        aliases: [seated-face-to-face, chairs-across]
        label: Seated directly across from each other
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits directly across from "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", with both bodies facing each other and their knees aligned."

      - key: seated_beside
        aliases: [seated-side-by-side, aligned-seated]
        label: Seated beside each other
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits beside "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " with their shoulders aligned and both facing the same direction."

      - key: one_seated_one_standing
        aliases: [seated-standing, stand-in-front-of-seated]
        label: One seated and one standing face-to-face
        append: none
        segments:
          - placeholder:
              id: seated_person
              label: Seated person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " sits upright while "
          - placeholder:
              id: standing_person
              label: Standing person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly in front of them, facing them."

      - key: both_kneeling_face_to_face
        aliases: [kneeling-together, aligned-knees]
        label: Both kneeling face-to-face
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " kneel upright directly in front of each other, facing each other with their knees aligned."

      - key: lying_with_seated_beside
        aliases: [lying-seated, seated-at-hip]
        label: One lying down, one seated beside
        append: none
        segments:
          - placeholder:
              id: lying_person
              label: Lying person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " lies flat on their back while "
          - placeholder:
              id: seated_person
              label: Seated person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " sits beside their hip, turned toward them."

      - key: lying_face_to_face
        aliases: [side-lying-facing, lying-aligned]
        label: Lying on sides face-to-face
        append: none
        segments:
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " lie on their sides facing each other, with their heads, shoulders, and hips aligned."

      - key: lying_same_direction
        aliases: [side-lying-same-direction, lying-behind]
        label: Lying on sides in the same direction
        append: none
        segments:
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " lies on their side directly behind "
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", with both bodies facing the same direction and aligned from shoulders to hips."

  - key: composition
    label: Two-Person Composition
    description: Camera-dependent compositions that reveal an already defined body relationship.
    choices:
      - key: foreground_background
        aliases: [depth-alignment, front-and-back]
        label: Foreground and background alignment
        append: none
        segments:
          - text: "From the camera's viewpoint, "
          - placeholder:
              id: foreground_person
              label: Foreground person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands in the center foreground while "
          - placeholder:
              id: background_person
              label: Background person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly behind them in the background. Both face the camera."

      - key: between_camera_and_person
        aliases: [camera-between, back-to-camera]
        label: One person between camera and the other
        append: none
        segments:
          - placeholder:
              id: near_person
              label: Near person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " stands between the camera and "
          - placeholder:
              id: far_person
              label: Far person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ", with the near person's back toward the camera and body facing the far person."

      - key: balanced_side_profile
        aliases: [profile-two-shot, face-to-face-profile]
        label: Balanced side-profile two-shot
        append: none
        segments:
          - text: "The camera frames "
          - placeholder:
              id: person_a
              label: First person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " and "
          - placeholder:
              id: person_b
              label: Second person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " in a balanced side-profile two-shot, clearly showing that they stand face-to-face."

      - key: over_shoulder_from_first
        aliases: [ots-first, over-first-shoulder]
        label: Over the first person's shoulder
        append: none
        segments:
          - text: "The camera looks over "
          - placeholder:
              id: near_person
              label: Near person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: "'s shoulder toward "
          - placeholder:
              id: far_person
              label: Far person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: ". The near person remains in the foreground and the far person faces them in the midground."

      - key: over_shoulder_from_second
        aliases: [ots-second, reverse-over-shoulder]
        label: Over the second person's shoulder
        append: none
        segments:
          - text: "The camera looks over "
          - placeholder:
              id: near_person
              label: Near person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: "'s shoulder toward "
          - placeholder:
              id: far_person
              label: Far person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: ". The near person remains in the foreground and the far person faces them in the midground."

      - key: symmetrical_two_shot
        aliases: [centered-two-shot, screen-left-right]
        label: Symmetrical face-to-face two-shot
        append: none
        segments:
          - text: "The camera holds a centered, symmetrical two-shot with "
          - placeholder:
              id: left_person
              label: Screen-left person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " on screen-left and "
          - placeholder:
              id: right_person
              label: Screen-right person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " on screen-right, both facing each other."

      - key: same_direction_two_shot
        aliases: [forward-two-shot, same-depth-plane]
        label: Two-shot facing the same direction
        append: none
        segments:
          - text: "The camera frames "
          - placeholder:
              id: left_person
              label: Screen-left person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " on screen-left and "
          - placeholder:
              id: right_person
              label: Screen-right person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " on screen-right in the same depth plane, with both bodies facing forward."

      - key: diagonal_depth
        aliases: [near-left-far-right, diagonal-composition]
        label: Diagonal depth composition
        append: none
        segments:
          - text: "The camera frames "
          - placeholder:
              id: near_person
              label: Near person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " in the near screen-left foreground and "
          - placeholder:
              id: far_person
              label: Far person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " in the far screen-right background, with both turned toward each other."

      - key: overhead_alignment
        aliases: [overhead-centerline, top-down-blocking]
        label: Overhead centerline alignment
        append: none
        segments:
          - text: "From an overhead view, "
          - placeholder:
              id: front_person
              label: Front person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " is positioned directly in front of "
          - placeholder:
              id: rear_person
              label: Rear person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " on the same centerline, with both bodies facing each other."

      - key: show_height_difference
        aliases: [level-difference, low-and-standing]
        label: Show a clear height difference
        append: none
        segments:
          - text: "In a full-body side-profile shot, "
          - placeholder:
              id: lower_person
              label: Lower person
              initial_text: "@person_a"
              hint: "Free text or an optional Director @reference"
          - text: " remains low in the frame while "
          - placeholder:
              id: upper_person
              label: Upper person
              initial_text: "@person_b"
              hint: "Free text or an optional Director @reference"
          - text: " stands directly above and in front of them."
