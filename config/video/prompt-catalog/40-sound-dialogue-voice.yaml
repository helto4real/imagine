schema_version: "1.0"
mode: merge
namespaces:
  - key: sound
    label: Soundscape
    description: Ambient, physical, and non-verbal sound wording kept separate from dialogue and music.
    choices:
      - key: beach_ambience
        aliases: [beach-soundscape, coastal-ambience]
        label: Beach ambience
        append: none
        segments:
          - text: "Steady beach ambience, rolling waves, distant gull calls, footsteps in dry sand, and soft clothing movement."

      - key: room_rain_ambience
        aliases: [quiet-room, rain-room]
        label: Quiet room and rain ambience
        append: none
        segments:
          - text: "Quiet room ambience, soft fabric movement, gentle footsteps, subtle breathing, and the faint sound of rain against the window."

      - key: environment_and_physical_actions
        aliases: [ambience-actions, environment-actions]
        label: Environment and physical action sounds
        append: none
        segments:
          - placeholder:
              id: ambience
              label: Environment ambience
              initial_text: "steady room ambience"
              hint: "Describe the constant environmental sound"
          - text: ", "
          - placeholder:
              id: physical_sounds
              label: Physical sounds
              initial_text: "footsteps, clothing movement, and object contact"
              hint: "List concrete sounds caused by visible actions"
          - text: "."

      - key: physical_only_after_dialogue
        aliases: [post-dialogue-sounds, no-extra-speech]
        label: Physical sounds only after dialogue
        append: none
        segments:
          - text: "After the authored line, only "
          - placeholder:
              id: sounds
              label: Remaining sounds
              initial_text: "room ambience and physical action sounds"
              hint: "List concrete non-dialogue sounds"
          - text: " remain audible."

      - key: natural_only_no_music
        aliases: [natural-without-score, natural-sound-only]
        label: Natural ambience and no score
        append: none
        segments:
          - text: "Only natural ambience, physical action sounds, and non-verbal human sounds are heard; no non-diegetic music is present."

      - key: quiet_aftermath
        aliases: [quiet-hallway, subtle-aftermath]
        label: Quiet aftermath ambience
        append: none
        segments:
          - text: "Only subtle room ambience, soft movement, and distant environmental sound remain audible."

      - key: explicit_nonverbal_sound
        aliases: [non-verbal-only, human-sound]
        label: Non-verbal human sound
        append: none
        segments:
          - placeholder:
              id: nonverbal_sound
              label: Non-verbal sound
              initial_text: "soft breathing"
              hint: "Describe a concrete non-verbal human sound, not dialogue"
          - text: " is audible alongside "
          - placeholder:
              id: ambience
              label: Ambience
              initial_text: "the established environmental ambience"
              hint: "Describe the surrounding soundscape"
          - text: "."

  - key: dialogue
    label: Dialogue
    description: Exact spoken lines, delivery, and positive before-and-after silence constraints.
    choices:
      - key: says_exact_line
        aliases: [say-exact-line, exact-dialogue]
        label: Character says exact line
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " says ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact spoken words"
              hint: "Enter only the words that should be spoken"
          - text: "\""

      - key: whispers_exact_line
        aliases: [whispers, quiet-dialogue]
        label: Character whispers exact line
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " whispers ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact whispered words"
              hint: "Enter only the words that should be whispered"
          - text: "\""

      - key: shouts_exact_line
        aliases: [shouts, loud-dialogue]
        label: Character shouts exact line
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " shouts ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact shouted words"
              hint: "Enter only the words that should be shouted"
          - text: "\""

      - key: delivery_exact_line
        aliases: [delivery-word, voice-delivery, speech-action]
        label: Character delivers exact line
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " "
          - placeholder:
              id: delivery
              label: Delivery word
              initial_text: "whispers"
              hint: "Use says, speaks, asks, replies, exclaims, whispers, murmurs, mutters, shouts, yells, screams, or sings"
          - text: " ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact spoken words"
              hint: "Enter only the words that should be spoken"
          - text: "\""

      - key: off_screen_line
        aliases: [off-screen, unseen-speaker]
        label: Off-screen dialogue
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " says off-screen ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact spoken words"
              hint: "Enter only the off-screen words"
          - text: "\""

      - key: voiceover_line
        aliases: [voiceover, narration]
        label: Voiceover dialogue
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " says in voiceover ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact voiceover words"
              hint: "Enter only the voiceover words"
          - text: "\""

      - key: silence_before_line
        aliases: [pre-dialogue-silence, lips-closed-before]
        label: Silence before exact line
        append: none
        segments:
          - text: "For "
          - placeholder:
              id: duration
              label: Silent duration
              initial_text: "the first two seconds"
              hint: "Describe the time window before dialogue"
          - text: ", "
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " remains silent with their lips completely closed. Only "
          - placeholder:
              id: sounds
              label: Audible sounds
              initial_text: "room ambience and physical sounds"
              hint: "List concrete non-dialogue sounds"
          - text: " are audible. No speech, murmuring, vocalization, or unintelligible words occur."

      - key: silence_after_line
        aliases: [post-dialogue-silence, lips-closed-after]
        label: Silence after exact line
        append: none
        segments:
          - text: "After finishing the exact line, "
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " closes their lips completely and remains silent for the rest of the shot. They speak only once. No additional speech, murmuring, vocalization, or unintelligible words occur. Only "
          - placeholder:
              id: sounds
              label: Remaining sounds
              initial_text: "room ambience and physical action sounds"
              hint: "List concrete sounds that continue after the line"
          - text: " remain audible."

      - key: timed_single_line
        aliases: [timed-dialogue, silence-line-silence]
        label: Timed line with silence before and after
        append: none
        segments:
          - text: "For "
          - placeholder:
              id: silent_duration
              label: Initial silent duration
              initial_text: "the first two seconds"
              hint: "Describe the silent time before the line"
          - text: ", "
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " remains silent with their lips completely closed while only "
          - placeholder:
              id: initial_sounds
              label: Initial sounds
              initial_text: "room ambience and physical sounds"
              hint: "List concrete non-dialogue sounds"
          - text: " are audible. Then "
          - placeholder:
              id: repeated_speaker
              label: Speaker in dialogue
              initial_text: "@speaker"
              hint: "Use the same speaker as the earlier placeholder"
          - text: " says ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact spoken words"
              hint: "Enter only the words that should be spoken"
          - text: "\". After the exact line, the speaker closes their lips and remains silent for the rest of the shot while only "
          - placeholder:
              id: final_sounds
              label: Final sounds
              initial_text: "room ambience and physical action sounds"
              hint: "List concrete sounds that continue after the line"
          - text: " remain audible."

      - key: delivery_then_exact_line
        aliases: [dialogue-delivery, tone-and-line]
        label: Delivery followed by exact line
        append: none
        segments:
          - placeholder:
              id: speaker
              label: Speaker
              initial_text: "@speaker"
              hint: "Free text or an optional Director @reference"
          - text: " speaks with "
          - placeholder:
              id: delivery
              label: Delivery
              initial_text: "a calm, clear, natural delivery"
              hint: "Describe tone, pacing, expression, or physical delivery"
          - text: " and says ["
          - placeholder:
              id: language
              label: Language
              initial_text: "English"
              hint: "Enter the spoken language"
          - text: "] \""
          - placeholder:
              id: line
              label: Exact line
              initial_text: "the exact spoken words"
              hint: "Enter only the words that should be spoken"
          - text: "\""

  - key: voice
    label: Voice Profile
    description: Text-only voice characteristics for tone, timbre, pace, accent, and articulation.
    choices:
      - key: profile
        aliases: [voice-description, text-voice]
        label: Text voice profile
        append: none
        segments:
          - text: "a "
          - placeholder:
              id: tone
              label: Tone and pitch
              initial_text: "warm, low"
              hint: "Describe pitch, warmth, and vocal quality"
          - text: " "
          - placeholder:
              id: language_or_accent
              label: Language or accent
              initial_text: "Swedish"
              hint: "Describe language, dialect, or accent"
          - text: " voice with "
          - placeholder:
              id: pace
              label: Pace
              initial_text: "a relaxed conversational pace"
              hint: "Describe speech speed and rhythm"
          - text: " and "
          - placeholder:
              id: articulation
              label: Articulation
              initial_text: "clear articulation"
              hint: "Describe clarity and delivery"

      - key: precise_timing_profile
        aliases: [controlled-voice, timing-first]
        label: Controlled voice for precise timing
        append: none
        segments:
          - text: "a "
          - placeholder:
              id: voice_quality
              label: Voice quality
              initial_text: "natural, clearly articulated voice"
              hint: "Describe the desired voice without referencing an audio recording"
          - text: " with stable pacing and restrained delivery suitable for one precisely timed authored line"

  - key: music
    label: Non-Diegetic Music
    description: Explicit guidance for the dedicated non-diegetic music prompt field.
    choices:
      - key: none
        aliases: [no-music, no-score]
        label: No non-diegetic music
        append: none
        segments:
          - text: "No non-diegetic music is present."
