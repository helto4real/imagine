schema_version: "1.0"
mode: merge
namespaces:
  - key: reference
    label: Reference Description
    description: Focused character, environment, and asset descriptions for MiniMax H3 references.
    choices:
      - key: character_identity
        aliases: [character-description, identity-description]
        label: Character identity description
        append: none
        segments:
          - placeholder:
              id: subject
              label: Character
              initial_text: "the character"
              hint: "Free text or an optional Director @reference"
          - text: " is "
          - placeholder:
              id: appearance
              label: Appearance
              initial_text: "an adult with clearly defined facial features, hair, and body proportions"
              hint: "Describe stable visible identity traits"
          - text: ", wearing "
          - placeholder:
              id: clothing
              label: Clothing
              initial_text: "the established clothing"
              hint: "Describe the clothing that should remain consistent"
          - text: "."

      - key: environment_identity
        aliases: [environment-description, location-description]
        label: Environment description
        append: none
        segments:
          - placeholder:
              id: environment
              label: Environment
              initial_text: "the environment"
              hint: "Name the location or environment"
          - text: " is "
          - placeholder:
              id: layout
              label: Layout and appearance
              initial_text: "an established space with clearly defined layout, materials, lighting, and spatial landmarks"
              hint: "Describe stable visible environmental features"
          - text: "."

      - key: clean_portrait_role
        aliases: [headshot-role, face-only-reference]
        label: Clean portrait identity role
        append: none
        segments:
          - text: "Use this reference for "
          - placeholder:
              id: identity_traits
              label: Identity traits
              initial_text: "facial identity, hair, glasses, and skin appearance only"
              hint: "List only the identity traits this portrait should control"
          - text: "; the source background, camera angle, pose, framing, and lighting are not used."

      - key: full_body_role
        aliases: [body-proportions-role, clothing-role]
        label: Full-body proportions and clothing role
        append: none
        segments:
          - text: "Use this reference for "
          - placeholder:
              id: body_traits
              label: Body and clothing traits
              initial_text: "body proportions, silhouette, and clothing"
              hint: "List the full-body traits this reference should control"
          - text: "; the source pose, background, framing, camera angle, and lighting are not used."

      - key: environment_layout_role
        aliases: [room-layout-role, spatial-reference]
        label: Environment layout role
        append: none
        segments:
          - text: "Use this reference for "
          - placeholder:
              id: environment_traits
              label: Environment traits
              initial_text: "room layout, materials, architectural landmarks, and lighting direction"
              hint: "List the environmental features this reference should control"
          - text: "; subject pose and source framing may change."

  - key: retention
    label: Retention Guidance
    description: Positive statements that limit what visual or audio references should preserve.
    choices:
      - key: fully_preserve_defined_role
        aliases: [fully-preserved-role, preserve-role]
        label: Fully preserve the defined role
        append: none
        segments:
          - text: "Fully preserve "
          - placeholder:
              id: preserved_traits
              label: Preserved traits
              initial_text: "the defined identity, appearance, and role"
              hint: "State exactly what the reference must preserve"
          - text: "."

      - key: character_identity_only
        aliases: [identity-only, partial-character]
        label: Preserve identity, not source composition
        append: none
        segments:
          - text: "Retain "
          - placeholder:
              id: identity_traits
              label: Identity traits
              initial_text: "the character's face, hair, distinctive features, and body proportions"
              hint: "List the identity traits to preserve"
          - text: "; do not retain "
          - placeholder:
              id: excluded_traits
              label: Excluded source traits
              initial_text: "the source background, pose, framing, camera angle, or lighting"
              hint: "List source properties that may change"
          - text: "."

      - key: spatial_continuity
        aliases: [room-continuity, layout-continuity]
        label: Preserve room layout and approximate positions
        append: none
        segments:
          - text: "Retain "
          - placeholder:
              id: spatial_traits
              label: Spatial traits
              initial_text: "the room layout, camera side, and approximate subject positions"
              hint: "List spatial features that must remain recognizable"
          - text: "; framing and action may change."

      - key: partial_visual_preservation
        aliases: [partial-preservation, preserve-selected-traits]
        label: Preserve selected visual traits
        append: none
        segments:
          - text: "Preserve "
          - placeholder:
              id: preserved
              label: Preserved properties
              initial_text: "the selected identity and environmental traits"
              hint: "List exactly what must remain"
          - text: ", while allowing "
          - placeholder:
              id: changeable
              label: Changeable properties
              initial_text: "pose, action, framing, and lighting to change"
              hint: "List exactly what may change"
          - text: "."

      - key: attribute_transfer
        aliases: [transfer-attributes, apply-traits]
        label: Transfer selected attributes
        append: none
        segments:
          - text: "Transfer "
          - placeholder:
              id: attributes
              label: Attributes
              initial_text: "the defined visual attributes"
              hint: "List the properties to transfer"
          - text: " from "
          - placeholder:
              id: source
              label: Source
              initial_text: "the source reference"
              hint: "Identify the source in free text or with an optional @reference"
          - text: " to "
          - placeholder:
              id: target
              label: Target
              initial_text: "the target subject"
              hint: "Identify the target in free text or with an optional @reference"
          - text: " without copying unrelated source composition or background."

      - key: weak_broad_similarity
        aliases: [weak-reference, broad-similarity]
        label: Use only broad similarity
        append: none
        segments:
          - text: "Use the reference only for broad similarity in "
          - placeholder:
              id: broad_traits
              label: Broad traits
              initial_text: "style, category, composition, or atmosphere"
              hint: "State the limited broad influence"
          - text: "; exact identity, framing, and source details need not be copied."

      - key: voice_as_reference_not_copy
        aliases: [voice-reference, audio-not-copy]
        label: Use voice as guidance, not copied signal
        append: none
        segments:
          - text: "Use the voice reference for "
          - placeholder:
              id: voice_traits
              label: Voice traits
              initial_text: "timbre, accent, pacing, and delivery"
              hint: "List the vocal qualities to reference"
          - text: " without copying the source recording or adding unrequested speech."

  - key: media
    label: Media Influence
    description: Concise roles for Section media anchors and reusable image or video assets.
    choices:
      - key: lighting_and_reflections
        aliases: [lighting-reflections, custom-lighting]
        label: Lighting direction and wet reflections
        append: none
        segments:
          - text: "lighting direction and wet-surface reflections"

      - key: opening_composition
        aliases: [first-frame-composition, opening-layout]
        label: Opening composition anchor
        append: none
        segments:
          - text: "Use this image to define the opening composition, camera side, subject placement, and major spatial landmarks."

      - key: keyframe_anchor
        aliases: [time-anchor, keyframe-role]
        label: Keyframe composition anchor
        append: none
        segments:
          - text: "Use this image to anchor "
          - placeholder:
              id: moment
              label: Target moment
              initial_text: "the target moment"
              hint: "Describe when or where the image should anchor the shot"
          - text: ", preserving its essential composition and subject arrangement while allowing natural motion into and out of the moment."

      - key: last_frame_anchor
        aliases: [ending-composition, final-frame-role]
        label: Ending composition anchor
        append: none
        segments:
          - text: "Use this image to define the final composition, subject placement, camera side, and major environmental landmarks."

      - key: motion_camera_rhythm
        aliases: [video-motion-role, camera-rhythm]
        label: Video motion and camera influence
        append: none
        segments:
          - text: "Use this video reference for "
          - placeholder:
              id: motion_traits
              label: Motion traits
              initial_text: "subject motion, camera trajectory, timing, and rhythm"
              hint: "List only the motion qualities this video should influence"
          - text: "; do not treat it as the source video to edit."
