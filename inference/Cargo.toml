[package]
name = "imagine-inference"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the experimental engine independent of the existing product workspace.
[workspace]

[dependencies]
tch = "=0.26.0"
torch-sys = "=0.26.0"
libc = "0.2"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = "=1.0.229"

sha2 = "=0.10.9"

[patch.crates-io]
# Preserve typed c10 allocation/accelerator failures across tch's string ABI.
torch-sys = { path = "vendor/torch-sys" }

[dev-dependencies]
torch-sys = { version = "=0.26.0", features = ["imagine-test-errors"] }

# Full-checkpoint SHA256 is development provenance, outside tensor arithmetic.
# Keep cold multi-gigabyte validation practical in the otherwise debug engine.
[profile.dev.package.sha2]
opt-level = 3
