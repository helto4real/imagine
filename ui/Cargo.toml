[package]
name = "imagine-ui"
version = "0.1.0"
edition = "2024"

[features]
ui-preview = []

[[example]]
name = "reference-desk"
required-features = ["ui-preview"]

[dependencies]
anyhow = "1"
fancy-regex = "0.16"
# Enable egui-winit's native Wayland clipboard fallback as well as X11.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imagine-video-contract = { path = "../crates/video-contract" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
st-proxy = { path = "../proxy" }
imagine-server = { path = ".." }
axum = "0.8"
tempfile = "3"
